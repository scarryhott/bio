[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-closure-rnd1"
version = "0.1.0"
description = "Closure-derived admissible verification and biological coevolution control for RND1"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8",
  "transformers>=5.0.0",
  "accelerate",
  "rich",
]

[project.optional-dependencies]
test = ["pytest>=8"]
linting = ["ruff>=0.13.2"]

[tool.setuptools.packages.find]
include = ["closure*", "rnd*"]

[tool.ruff]
line-length = 100
target-version = "py311"
